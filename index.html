<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Сайт на GitHub Pages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Кнопка настроек в правом верхнем углу -->
    <button class="settings-btn" id="settingsBtn" aria-label="Открыть настройки">
        ⚙️
    </button>

    <!-- Панель настроек (модальное окно) -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3>Настройки</h3>
            <button class="close-btn" id="closeBtn">&times;</button>
        </div>
        
        <div class="settings-body">
            <!-- Выбор темы -->
            <div class="setting-item">
                <label for="themeSelect">Тема оформления:</label>
                <select id="themeSelect">
                    <option value="light">Светлая</option>
                    <option value="dark">Тёмная</option>
                    <option value="custom">Кастомная</option>
                </select>
            </div>

            <!-- Кастомные цвета (скрыты по умолчанию) -->
            <div id="customColors" class="custom-colors-group hidden">
                <div class="color-picker-item">
                    <label for="bgColorPicker">Цвет фона:</label>
                    <input type="color" id="bgColorPicker" value="#ffffff">
                </div>
                <div class="color-picker-item">
                    <label for="textColorPicker">Цвет текста:</label>
                    <input type="color" id="textColorPicker" value="#000000">
                </div>
            </div>

            <!-- Ползунок громкости -->
            <div class="setting-item">
                <label for="volumeSlider">Громкость:</label>
                <div class="volume-container">
                    <input type="range" id="volumeSlider" min="0" max="100" value="50">
                    <span id="volumeValue">50%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Основной контент сайта -->
    <main class="content-container">
        <!-- Блок для вашей будущей информации -->
        <section class="info-block">
            <h1>Добро пожаловать!</h1>
            <div class="placeholder-text">
                <p><strong>[МЕСТО ДЛЯ ВАШЕЙ ИНФОРМАЦИИ]</strong></p>
                <p>Пришлите текст или данные позже, и мы заменим этот блок на ваш полноценный контент. Сейчас здесь находится временная заглушка, чтобы вы видели, как сайт выглядит в разных темах оформления.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
