<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Сайт на GitHub Pages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Кнопка настроек (шестерёнка) — скрывается при открытии панели -->
    <button class="settings-btn" id="settingsBtn" aria-label="Открыть настройки">
        ⚙️
    </button>

    <!-- Прокачанная панель настроек -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3>⚙️ Настройки</h3>
            <button class="close-btn" id="closeBtn" aria-label="Закрыть настройки">&times;</button>
        </div>
        
        <div class="settings-body">
            <!-- Выбор темы -->
            <div class="setting-item">
                <label for="themeSelect">Тема оформления</label>
                <select id="themeSelect">
                    <option value="light">☀️ Светлая премиум</option>
                    <option value="dark">🌙 Тёмная ночь</option>
                    <option value="custom">🎨 Свой стиль (Кастом)</option>
                </select>
            </div>

            <!-- Красивая дизайнерская группа для кастомных цветов -->
            <div id="customColors" class="custom-colors-group hidden">
                <div class="custom-colors-title">Настройка палитры</div>
                
                <div class="color-picker-item">
                    <span class="color-label">🏞️ Фон страницы</span>
                    <div class="color-input-wrapper">
                        <input type="color" id="bgColorPicker" value="#ffffff">
                    </div>
                </div>
                
                <div class="color-picker-item">
                    <span class="color-label">✍️ Цвет текста</span>
                    <div class="color-input-wrapper">
                        <input type="color" id="textColorPicker" value="#000000">
                    </div>
                </div>
            </div>

            <!-- Ползунок громкости -->
            <div class="setting-item">
                <label for="volumeSlider">Громкость звука</label>
                <div class="volume-container">
                    <span class="volume-icon">🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50">
                    <span id="volumeValue">50%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Основной контент сайта -->
    <main class="content-container">
        <section class="info-block">
            <h1>Добро пожаловать!</h1>
            <div class="placeholder-text">
                <p><strong>[МЕСТО ДЛЯ ВАШЕЙ ИНФОРМАЦИИ]</strong></p>
                <p>Пришлите сюда текст, картинки или ссылки, и мы сделаем из этого крутой блок. Настройки уже работают на полную мощность — проверь шестерёнку в углу!</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
