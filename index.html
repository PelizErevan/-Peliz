<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0514">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Хэллоуин">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Хэллоуинская ночь</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/blockblast.css">
  <link rel="stylesheet" href="css/hidden.css">
  <link rel="stylesheet" href="css/match3.css">
  <link rel="stylesheet" href="css/rules.css">
  <link rel="stylesheet" href="css/tower.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/mg-swamp.css">
  <link rel="stylesheet" href="css/mg-bats.css">
  <link rel="stylesheet" href="css/mg-potion.css">
  <link rel="stylesheet" href="css/mg-pumpkin.css">
  <link rel="stylesheet" href="css/mg-spider.css">
  <link rel="stylesheet" href="css/mg-maze.css">
  <link rel="stylesheet" href="css/mg-candle.css">
  <link rel="stylesheet" href="css/mg-grave.css">
  <link rel="stylesheet" href="css/mg-candy.css">
  <link rel="stylesheet" href="css/mg-owl.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body data-screen="title">

  <!-- Анимированный ночной фон -->
  <div id="bg">
    <div class="bg-glow"></div>
    <div class="bg-moon"></div>
    <div id="bg-stars"></div>
    <div class="bg-fog fog1"></div>
    <div class="bg-fog fog2"></div>
    <div class="bg-bat b1"></div>
    <div class="bg-bat b2"></div>
    <div class="bg-bat b3"></div>
  </div>

  <!-- Верхняя панель -->
  <header id="hud">
    <button id="btn-back" class="btn btn-small btn-ghost" type="button">🗺 Карта</button>
    <div id="hud-title">Хэллоуинская ночь</div>
    <div class="hud-right">
      <div id="tokens" class="tokens" title="Хэллоуинские жетоны"><span class="coin">🎃</span><b id="tokens-n">0</b></div>
      <button id="btn-music" class="btn btn-icon" type="button" title="Музыка">🎵</button>
      <button id="btn-sound" class="btn btn-icon" type="button" title="Звуки">🔊</button>
    </div>
  </header>

  <main id="app">
    <section class="screen" id="screen-title"></section>
    <section class="screen" id="screen-map"></section>
    <section class="screen" id="screen-bb"></section>
    <section class="screen" id="screen-bb2"></section>
    <section class="screen" id="screen-rk"></section>
    <section class="screen" id="screen-tw"></section>
    <section class="screen" id="screen-hid"></section>
    <section class="screen" id="screen-m3"></section>
    <section class="screen" id="screen-shop"></section>
    <section class="screen" id="screen-home"></section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="fx-root"></div>
  <div id="rotate"><div class="r-ico">📱</div><b>Поверни телефон вертикально</b><span>Игра рассчитана на вертикальный экран (или сделай окно выше).</span></div>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#000">Включи JavaScript, чтобы играть.</p></noscript>

  <script src="js/core.js"></script>
  <script src="js/art.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/items.js"></script>
  <script src="js/map.js"></script>
  <script src="js/forest-map.js"></script>
  <script src="js/blockblast.js"></script>
  <script src="js/hidden.js"></script>
  <script src="js/hidden-rooms.js"></script>
  <script src="js/match3.js"></script>
  <script src="js/rk-engine.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/tower.js"></script>
  <script src="js/arcade.js"></script>
  <script src="js/mg-swamp.js"></script>
  <script src="js/mg-bats.js"></script>
  <script src="js/mg-potion.js"></script>
  <script src="js/mg-pumpkin.js"></script>
  <script src="js/mg-spider.js"></script>
  <script src="js/mg-maze.js"></script>
  <script src="js/mg-candle.js"></script>
  <script src="js/mg-grave.js"></script>
  <script src="js/mg-candy.js"></script>
  <script src="js/mg-owl.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
